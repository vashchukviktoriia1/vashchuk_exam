name: Task3 - Deploy App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev/release/both)'
        required: true
        default: 'both'

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          repository: YulianSalo/devops-exam-pt2
          ref: develop

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push develop image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: viktoriiavashchuk/vashchukapp:develop

      - name: Checkout tag 1.0.0
        uses: actions/checkout@v4
        with:
          repository: YulianSalo/devops-exam-pt2
          ref: '1.0.0'

      - name: Build and push 1.0.0 image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: viktoriiavashchuk/vashchukapp:1.0.0

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

      - name: Deploy dev environment
        if: ${{ github.event.inputs.environment == 'dev' || github.event.inputs.environment == 'both' }}
        run: |
          ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no root@${{ secrets.VM_IP }} << 'EOF'
            set -e
            # Створення namespace та деплой
            kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply -f /root/k8s/dev-deployment.yml
            kubectl rollout status deployment/app-dev -n dev
            
            # Надійне звільнення порту 8002 (вбиваємо старі процеси port-forward)
            sudo lsof -t -i:8002 | xargs -r sudo kill -9 || true
            
            # Запуск port-forward у фоні
            nohup kubectl port-forward svc/app-dev-service 8002:8000 -n dev --address=0.0.0.0 > /dev/null 2>&1 &
            
            sleep 2
            exit 0
          EOF

      - name: Deploy release environment
        if: ${{ github.event.inputs.environment == 'release' || github.event.inputs.environment == 'both' }}
        run: |
          ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no root@${{ secrets.VM_IP }} << 'EOF'
            set -e
            # Створення namespace та деплой
            kubectl create namespace release --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply -f /root/k8s/release-deployment.yml
            kubectl rollout status deployment/app-release -n release
            
            # Надійне звільнення порту 8003
            sudo lsof -t -i:8003 | xargs -r sudo kill -9 || true
            
            # Запуск port-forward у фоні
            nohup kubectl port-forward svc/app-release-service 8003:8000 -n release --address=0.0.0.0 > /dev/null 2>&1 &
            
            sleep 2
            exit 0
          EOF
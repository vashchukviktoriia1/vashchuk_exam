name: Task3 - Deploy App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev/release/both)'
        required: true
        default: 'both'

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          repository: YulianSalo/devops-exam-pt2
          ref: develop

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push develop image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: viktoriiavashchuk/vashchukapp:develop

      - name: Checkout tag 1.0.0
        uses: actions/checkout@v4
        with:
          repository: YulianSalo/devops-exam-pt2
          ref: '1.0.0'

      - name: Build and push release image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: viktoriiavashchuk/vashchukapp:1.0.0

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

      - name: Deploy dev environment
        if: ${{ github.event.inputs.environment == 'dev' || github.event.inputs.environment == 'both' }}
        run: |
          ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no root@${{ secrets.VM_IP }} bash << 'EOF'
            set -e
            echo "Deploying DEV..."
            kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply -f /root/k8s/dev-deployment.yml
            kubectl rollout status deployment/app-dev -n dev
            pkill -f "port-forward.*8002" || true
            sleep 2
            nohup kubectl port-forward svc/app-dev-service 8002:8002 -n dev --address 0.0.0.0 > /tmp/pf-dev.log 2>&1 &
            sleep 3
            echo "DEV deployed on port 8002"
          EOF

      - name: Deploy release environment
        if: ${{ github.event.inputs.environment == 'release' || github.event.inputs.environment == 'both' }}
        run: |
          ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no root@${{ secrets.VM_IP }} bash << 'EOF'
            set -e
            echo "Deploying RELEASE..."
            kubectl create namespace release --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply -f /root/k8s/release-deployment.yml
            kubectl rollout status deployment/app-release -n release
            pkill -f "port-forward.*8003" || true
            sleep 2
            nohup kubectl port-forward svc/app-release-service 8003:8003 -n release --address 0.0.0.0 > /tmp/pf-release.log 2>&1 &
            sleep 3
            echo "RELEASE deployed on port 8003"
          EOF

apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-release
  namespace: release
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-release
  template:
    metadata:
      labels:
        app: app-release
    spec:
      containers:
        - name: app-release
          image: viktoriiavashchuk/vashchukapp:1.0.0
          ports:
            - containerPort: 8003
          env:
            - name: PORT
              value: "8003"
---
apiVersion: v1
kind: Service
metadata:
  name: app-release-service
  namespace: release
spec:
  selector:
    app: app-release
  type: NodePort
  ports:
    - port: 8003
      targetPort: 8003
      nodePort: 30003
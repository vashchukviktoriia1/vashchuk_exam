apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-dev
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-dev
  template:
    metadata:
      labels:
        app: app-dev
    spec:
      containers:
        - name: app-dev
          image: viktoriavashchuk/vashchukapp:develop
          ports:
            - containerPort: 8002
          env:
            - name: PORT
              value: "8002"
---
apiVersion: v1
kind: Service
metadata:
  name: app-dev-service
  namespace: dev
spec:
  selector:
    app: app-dev
  type: NodePort
  ports:
    - port: 8002
      targetPort: 8002
      nodePort: 30002